<div class="dashboard-container">
  <div class="card">
    <div class="card-header">
      <h2>Personal Job Finder</h2>
      <span class="subtitle">System Status Dashboard</span>
    </div>

    <div class="card-body">
      <!-- Loading indicator -->
      <div *ngIf="loading()" class="status-box loading">
        <div class="spinner"></div>
        <p>Checking system connection...</p>
      </div>

      <!-- Error box -->
      <div *ngIf="!loading() && error()" class="status-box error">
        <div class="icon">⚠️</div>
        <h3>System Unreachable</h3>
        <p>{{ error() }}</p>
      </div>

      <!-- Success status display -->
      <div *ngIf="!loading() && healthData()" class="status-display">
        <div class="status-item">
          <span class="label">Backend API Status:</span>
          <span class="badge" [ngClass]="healthData()?.status === 'healthy' ? 'success' : 'danger'">
            {{ healthData()?.status | uppercase }}
          </span>
        </div>

        <div class="status-item">
          <span class="label">SQLite Database:</span>
          <span class="badge" [ngClass]="healthData()?.database === 'connected' ? 'success' : 'danger'">
            {{ healthData()?.database | uppercase }}
          </span>
        </div>

        <div class="success-message">
          <div class="icon-success">✓</div>
          <p>System foundation is successfully configured and connected!</p>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn-primary" (click)="checkHealth()" [disabled]="loading()">
        {{ loading() ? 'Refreshing...' : 'Refresh Status' }}
      </button>
    </div>
  </div>
</div>
